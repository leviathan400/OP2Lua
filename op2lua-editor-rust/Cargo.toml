[package]
name = "op2luaeditor"
version = "0.8.19"
edition = "2024"
rust-version = "1.99"
description = "A mission layout editor for OP2Lua and Outpost 2"
license = "GPL-3.0-or-later"

[[bin]]
name = "OP2LuaEditor"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
eframe = { version = "0.37.0", features = ["persistence"] }
epaint_default_fonts = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
op2-formats = "0.5"
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "hound"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Map loading (tile decoding, atlases) is slow unoptimised; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
